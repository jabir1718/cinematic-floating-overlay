plugins {
    id 'com.android.application' version '8.7.3'
}

android {
    namespace 'com.jabir.cinematicoverlay'
    compileSdk 35

    defaultConfig {
        applicationId 'com.jabir.cinematicoverlay'
        minSdk 26
        targetSdk 35
        versionCode 2
        versionName '2.0'
    }
}

dependencies {
    implementation('io.socket:socket.io-client:2.1.0') {
        exclude group: 'org.json', module: 'json'
    }
}
